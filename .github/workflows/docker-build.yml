name: Build and Push Docker Image to GitHub Container Registry

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
  workflow_dispatch: # This allows manual triggering of the workflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Verify the project compiles before building the image
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore StarInventoryAPI.csproj

      - name: Build
        run: dotnet build StarInventoryAPI.csproj --no-restore --configuration Release

      # Log in to GitHub's Container Registry using the GITHUB_TOKEN
      # Only on master (push or manual dispatch); pull requests never publish images
      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: set lower case owner name
        run: |
          echo "REPO_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository }}"

      - name: Build and push docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}

      - name: UpdateGitOps repository
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        shell: bash
        env:
          GIT_TOKEN: ${{secrets.GITOPS_PAT }}
        run: |
          # Setup creds
          git config --global credential.helper store
          echo "https://${GIT_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials
          rm -rf gitops

          # Clone repo and cd to app
          git clone https://github.com/even44/kubuxter.git gitops
          cd gitops/talos-proxmox-cluster/kustomize/starinventory

          # Replace image
          sed -i "s|image: ghcr.io/${{ env.REPO_LC }}:.*|image: ghcr.io/${{ env.REPO_LC}}:${{github.sha}}|g" api-deployment.yaml

          # Commit changes
          git config --global user.name "Github Actions - Star Inventory"
          git config --global user.email "actions@github.com"
          git add api-deployment.yaml
          if git diff --cached --quiet; then
            echo "Image already set to ${{github.sha}}, nothing to commit"
            exit 0
          fi
          git commit -m "Update image to ${{github.sha}}"

          # Never force-push the GitOps repo; rebase onto any concurrent commits and retry instead
          for attempt in 1 2 3; do
            if git push https://${GIT_TOKEN}@github.com/even44/kubuxter.git HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "Failed to push GitOps update after 3 attempts" >&2
          exit 1
